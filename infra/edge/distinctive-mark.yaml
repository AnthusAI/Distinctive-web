AWSTemplateFormatVersion: '2010-09-09'
Description: papyrus-edge-distinctive-mark CloudFront distribution for distinctive-mark.com. Default behavior serves the Distinctive S3 projection bucket through OAC; /newsroom*, /_next/* and /api/* go to the CMS Amplify app main branch.
Parameters:
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1 covering ApexHost and WwwHost. Empty creates the distribution without aliases, on its cloudfront.net name only.
  ApexHost:
    Type: String
    Default: distinctive-mark.com
  WwwHost:
    Type: String
    Default: www.distinctive-mark.com
  SiteBucketRegionalDomainName:
    Type: String
    Description: The backend site bucket, <bucket>.s3.us-east-1.amazonaws.com (PAPYRUS_SITE_BUCKET on content-actions).
  RedirectsKeyValueStoreArn:
    Type: String
    Description: The backend redirects key-value store (PAPYRUS_REDIRECTS_KVS_ARN on content-actions).
  CmsAppId:
    Type: String
    Description: Amplify app id of distinctive-cms (CmsAppId output of amplify-app-shell-distinctive-cms).
Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
Resources:
  SiteViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-site-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: www to apex, key-value-store redirects, directory index documents, Accept text/markdown to the .md twin
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !Ref RedirectsKeyValueStoreArn
      FunctionCode: !Sub |
        import cf from "cloudfront";

        const redirectStore = cf.kvs();
        const APEX_HOST = "${ApexHost}";
        const WWW_HOST = "${WwwHost}";

        function serializedQuery(querystring) {
          const parts = [];
          Object.keys(querystring).forEach(function (name) {
            const entry = querystring[name];
            const values = entry.multiValue ? entry.multiValue.map(function (item) { return item.value; }) : [entry.value];
            values.forEach(function (value) {
              parts.push(value === "" ? name : name + "=" + value);
            });
          });
          return parts.length > 0 ? "?" + parts.join("&") : "";
        }

        function permanentRedirect(location) {
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: { location: { value: location } },
          };
        }

        async function lookUpRedirectTarget(uri) {
          try {
            const target = await redirectStore.get(uri);
            return target ? String(target) : null;
          } catch (error) {
            return null;
          }
        }

        function rewriteToIndexDocument(uri) {
          if (uri.endsWith("/")) {
            return uri + "index.html";
          }
          const lastSegment = uri.substring(uri.lastIndexOf("/") + 1);
          if (lastSegment.indexOf(".") === -1) {
            return uri + "/index.html";
          }
          return uri;
        }

        function qualityOf(accept, mediaType) {
          let quality = 0;
          const parts = accept.toLowerCase().split(",");
          for (let index = 0; index < parts.length; index += 1) {
            const fields = parts[index].split(";");
            if (fields[0].trim() !== mediaType) {
              continue;
            }
            quality = 1;
            for (let field = 1; field < fields.length; field += 1) {
              const pair = fields[field].trim();
              if (pair.indexOf("q=") === 0) {
                quality = Number(pair.substring(2));
                if (isNaN(quality)) {
                  quality = 0;
                }
              }
            }
          }
          return quality;
        }

        function prefersMarkdown(request) {
          const header = request.headers && request.headers.accept;
          if (!header || !header.value) {
            return false;
          }
          const markdown = qualityOf(header.value, "text/markdown");
          return markdown > 0 && markdown > qualityOf(header.value, "text/html");
        }

        function markdownTwin(uri) {
          if (uri === "/404.html" || uri.length < 6 || uri.substring(uri.length - 5) !== ".html") {
            return null;
          }
          return uri.substring(0, uri.length - 5) + ".md";
        }

        async function handler(event) {
          const request = event.request;
          const host = request.headers.host ? request.headers.host.value : "";
          if (host === WWW_HOST) {
            return permanentRedirect("https://" + APEX_HOST + request.uri + serializedQuery(request.querystring));
          }
          const redirectTarget = await lookUpRedirectTarget(request.uri);
          if (redirectTarget !== null) {
            return permanentRedirect(redirectTarget);
          }
          request.uri = rewriteToIndexDocument(request.uri);
          if (prefersMarkdown(request)) {
            const twin = markdownTwin(request.uri);
            if (twin !== null) {
              request.uri = twin;
            }
          }
          return request;
        }
  CmsViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-cms-forward-host'
      AutoPublish: true
      FunctionConfig:
        Comment: www to apex; copy the viewer Host to x-forwarded-host for the Amplify CMS origin
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var APEX_HOST = "${ApexHost}";
        var WWW_HOST = "${WwwHost}";

        function serializedQuery(querystring) {
          var parts = [];
          Object.keys(querystring).forEach(function (name) {
            var entry = querystring[name];
            var values = entry.multiValue ? entry.multiValue.map(function (item) { return item.value; }) : [entry.value];
            values.forEach(function (value) {
              parts.push(value === "" ? name : name + "=" + value);
            });
          });
          return parts.length > 0 ? "?" + parts.join("&") : "";
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : "";
          if (host === WWW_HOST) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: "https://" + APEX_HOST + request.uri + serializedQuery(request.querystring) } },
            };
          }
          request.headers["x-forwarded-host"] = { value: host };
          return request;
        }
  SiteBucketOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-bucket'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: distinctive-mark.com (S3 projection, newsroom on /newsroom)
        Aliases: !If [HasCertificate, [!Ref ApexHost, !Ref WwwHost], !Ref 'AWS::NoValue']
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site-bucket
            DomainName: !Ref SiteBucketRegionalDomainName
            OriginAccessControlId: !GetAtt SiteBucketOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: cms
            DomainName: !Sub 'main.${CmsAppId}.amplifyapp.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteViewerRequestFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: '/newsroom*'
            TargetOriginId: cms
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CmsViewerRequestFunction.FunctionARN
          - PathPattern: '/_next/*'
            TargetOriginId: cms
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CmsViewerRequestFunction.FunctionARN
          - PathPattern: '/api/*'
            TargetOriginId: cms
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CmsViewerRequestFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
Outputs:
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionArn:
    Value: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
