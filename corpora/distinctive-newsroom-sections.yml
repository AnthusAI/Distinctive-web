schemaVersion: 1
sections:
  - id: rulings
    title: "TTAB Rulings"
    shortTitle: "From the Board"
    type: canonical
    editorialMission: "Track every decision of the Trademark Trial and Appeal Board we follow: a one-line summary for each, and full analysis for the decisions that change practice."
    editorialPolicy: "Summarize from the opinion on TTABVUE, never from secondary reporting. Give the caption, proceeding, issue, outcome and precedential status exactly as the Board states them. Rate notability from 1 to 5 and reserve 4 and 5 for decisions practitioners must account for."
    assignmentGuidance: "Read the opinion first. Fill in every ruling field, write the one-line summary, then decide whether the decision earns analysis."
    killCriteria: "Reject summaries that misstate the holding, the outcome or the precedential status."
    enabled: true
    sortOrder: 1

  - id: commentary
    title: "Commentary"
    shortTitle: "Doctrine & Practice"
    type: canonical
    editorialMission: "Explain trademark doctrine and USPTO practice for people who file, oppose and defend marks: what the law is, how the Board applies it, and what to do differently."
    editorialPolicy: "Cite the decisions and rules every claim rests on. Keep commentary separate from summary. Label opinion as opinion. Commentary is general information, not legal advice."
    assignmentGuidance: "Start from a recurring problem in practice. Collect the controlling decisions, then write the field guide a practitioner would want."
    killCriteria: "Reject pieces without citations, and pieces that restate a ruling summary without adding analysis."
    enabled: true
    sortOrder: 2

  - id: wire
    title: "The Wire"
    shortTitle: "Outside News"
    type: canonical
    editorialMission: "Point readers to trademark news from the USPTO, the courts and the press, linked at the source, with one line on why it matters."
    editorialPolicy: "Link the primary source when one exists. The take is one or two sentences and says what a practitioner should do or watch."
    assignmentGuidance: "Each item needs a source category, the source link, the outlet and the take."
    killCriteria: "Reject items without a working source link."
    enabled: true
    sortOrder: 3
